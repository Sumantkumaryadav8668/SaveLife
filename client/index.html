    <title>SaveLife – SDEC — Smart Digital Emergency Care</title>
    <script>
      // Force unregister service workers only on development servers to prevent stale intercept deadlocks
      if (window.location.hostname === 'localhost' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister().then(function(success) {
              if (success) {
                console.log('[LifeSave] Unregistered stale service worker successfully.');
                window.location.reload();
              }
            });
          }
        });
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
